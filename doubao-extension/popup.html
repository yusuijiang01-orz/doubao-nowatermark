<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>豆包无水印下载</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: #0f0f1a;
      color: #e8e8f0;
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 13px;
      overflow: hidden;
    }

    /* ── 头部 ── */
    .header {
      background: linear-gradient(135deg, #6c63ff, #4e46e5);
      padding: 16px 18px 14px;
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .header-icon {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.18);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .header-text h1 { font-size: 14px; font-weight: 700; color: #fff; line-height: 1.2; }
    .header-text p  { font-size: 11px; color: rgba(255,255,255,0.72); margin-top: 3px; }

    /* ── 卡片 ── */
    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a45;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 10px; font-weight: 600; color: #6666aa;
      text-transform: uppercase; letter-spacing: .6px;
      margin-bottom: 9px;
    }

    .body { padding: 14px 14px 12px; }

    /* ── 状态行 ── */
    .status-row {
      display: flex; align-items: center; gap: 8px;
      padding: 3px 0; font-size: 12px; color: #9999bb;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: #3a3a5c; }
    .status-dot.green  { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,.5); }
    .status-dot.yellow { background: #fbbf24; box-shadow: 0 0 6px rgba(251,191,36,.4); }
    .status-row .val { color: #c8c8e8; margin-left: auto; font-size: 11px; }

    /* ── 捕获统计 ── */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 2px; }
    .stat-item {
      background: #12122a; border: 1px solid #252545;
      border-radius: 7px; padding: 7px 6px; text-align: center;
    }
    .stat-num   { font-size: 18px; font-weight: 700; color: #a78bfa; line-height: 1; }
    .stat-label { font-size: 10px; color: #666688; margin-top: 3px; }

    /* ── 格式设置 ── */
    .fmt-row { display: flex; gap: 7px; margin-bottom: 10px; }
    .fmt-btn {
      flex: 1; padding: 7px 0; border-radius: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      border: none; transition: filter .15s; font-family: inherit;
    }
    .fmt-btn.active {
      background: linear-gradient(135deg, #6c63ff, #4e46e5); color: #fff;
    }
    .fmt-btn.inactive {
      background: #12122a; color: #888899; border: 1px solid #2a2a45;
    }
    .qual-row { margin-top: 4px; }
    .qual-row label { font-size: 11px; color: #888899; display: flex; justify-content: space-between; margin-bottom: 5px; }
    .qual-row input[type=range] { width: 100%; accent-color: #6c63ff; cursor: pointer; }
    .fmt-hint { font-size: 10px; color: #555577; line-height: 1.5; margin-top: 8px; }

    /* ── 操作按钮组 ── */
    .btn-group { display: flex; gap: 8px; }
    .action-btn {
      flex: 1; padding: 9px 0;
      border: none; border-radius: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: filter .15s; font-family: inherit;
    }
    .btn-primary { background: linear-gradient(135deg, #6c63ff, #4e46e5); color: #fff; }
    .btn-blue    { background: linear-gradient(135deg, #0ea5e9, #0284c7);  color: #fff; }
    .action-btn:hover  { filter: brightness(1.12); }
    .action-btn:active { filter: brightness(.95); }

    /* ── 打开豆包 ── */
    .open-btn {
      display: block; width: 100%; padding: 9px;
      background: linear-gradient(135deg, #6c63ff, #4e46e5);
      color: #fff; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      text-align: center; transition: filter .15s; font-family: inherit;
    }
    .open-btn:hover { filter: brightness(1.12); }

    hr { border: none; border-top: 1px solid #1e1e35; margin: 2px 0 10px; }

    /* ── 底部 ── */
    .footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px 12px; border-top: 1px solid #1e1e35;
    }
    .author { font-size: 11px; color: #555577; }
    .author a { color: #7c6fe0; font-weight: 600; text-decoration: none; transition: color .2s; }
    .author a:hover { color: #8d82e4; text-decoration: underline; text-underline-offset: 2px; }
    .version-badge {
      font-size: 10px; color: #555577;
      background: #1a1a2e; border: 1px solid #252545;
      padding: 2px 8px; border-radius: 20px;
    }
  </style>
</head>
<body>

  <!-- 头部 -->
  <div class="header">
    <div class="header-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        <line x1="2" y1="2" x2="22" y2="22" stroke-width="2" stroke="rgba(255,255,255,0.5)"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>豆包无水印下载</h1>
      <p>Doubao Image Watermark Remover</p>
    </div>
  </div>

  <div class="body">

    <!-- 运行状态 -->
    <div class="card">
      <div class="card-title">运行状态</div>
      <div class="status-row">
        <div class="status-dot green"></div>
        <span>扩展已启用</span>
        <span class="val">正常运行</span>
      </div>
      <div class="status-row" style="margin-top:4px">
        <div class="status-dot" id="dot-page"></div>
        <span>当前页面</span>
        <span class="val" id="page-text">检测中...</span>
      </div>
    </div>

    <!-- 本次会话捕获统计 -->
    <div class="card">
      <div class="card-title">本次会话捕获</div>
      <div class="stat-grid">
        <div class="stat-item"><div class="stat-num" id="cnt-ori">—</div><div class="stat-label">原图</div></div>
        <div class="stat-item"><div class="stat-num" id="cnt-dld">—</div><div class="stat-label">DLD</div></div>
        <div class="stat-item"><div class="stat-num" id="cnt-pre">—</div><div class="stat-label">PRE</div></div>
      </div>
    </div>

    <!-- 下载格式设置 -->
    <div class="card">
      <div class="card-title">下载格式</div>
      <div class="fmt-row">
        <button class="fmt-btn" id="fmt-png">PNG 无损</button>
        <button class="fmt-btn" id="fmt-jpg">JPEG 有损</button>
      </div>
      <div class="qual-row" id="qual-row" style="display:none">
        <label>
          <span>JPEG 质量</span>
          <span id="qual-val">92%</span>
        </label>
        <input id="qual-slider" type="range" min="60" max="100" value="92">
      </div>
      <div class="fmt-hint">
        PNG：无损，文件较大 &nbsp;|&nbsp; JPEG：体积小，质量可调
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="card" id="action-card" style="display:none">
      <div class="card-title">快捷操作</div>
      <div class="btn-group">
        <button class="action-btn btn-primary" id="btn-single">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          下载当前图
        </button>
        <button class="action-btn btn-blue" id="btn-batch">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          批量下载
        </button>
      </div>
    </div>

    <button class="open-btn" id="open-doubao">打开豆包</button>

  </div>

  <!-- 底部 -->
  <div class="footer">
    <div class="author">作者 <a href="https://github.com/yusuijiang01-orz" target="_blank">@yusuijiang</a></div>
    <div class="version-badge" id="ver-badge">v4.0.0</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
